spring:
  application:
    name: hsm

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hospitalsystems_xv3d}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      leak-detection-threshold: 2000

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    defer-datasource-initialization: true   # run data.sql AFTER Hibernate builds tables

  flyway:
    enabled: false

  sql:
    init:
      mode: always                          # always run the seed script
      continue-on-error: true               # ignore "already exists" on re-runs
      platform: postgres

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

jwt:
  secret: ${JWT_SECRET:curamatrix-hsm-secret-key-for-jwt-token-generation-minimum-512-bits}
  expiration: 86400000  # 24 hours in milliseconds

deepgram:
  api:
    key: ${DEEPGRAM_API_KEY:}

server:
  port: 8080

logging:
  file:
    path: /app/logs
  logback:
    rollingpolicy:
      file-name-pattern: /app/logs/hsm-%d{yyyy-MM-dd}.%i.log
      max-history: 30
      clean-history-on-start: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

info:
  app:
    name: CuraMatrix HSM
    description: Hospital Management System - Multi-Tenant SaaS
    version: '@project.version@'
  build:
    artifact: '@project.artifactId@'
    group: '@project.group@'

management:
  info:
    env:
      enabled: true
    git:
      mode: full
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always
      show-components: always

