spring:
  application:
    name: hsm

  datasource:
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://dpg-dbq51ron74is739oc4m0-a.virginia-postgres.render.com:5432/curamatrix_db?sslmode=require}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:curamatrix_db_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:ut7UPowmHClmLvbPnjuRUbJ7z0nYMJzF}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
      minimum-idle: 1
      max-lifetime: 1800000
      keepalive-time: 30000
      leak-detection-threshold: 0
      initialization-fail-timeout: -1

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    defer-datasource-initialization: true

  flyway:
    enabled: false

  sql:
    init:
      mode: always

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

jwt:
  secret: ${JWT_SECRET:curamatrix-hsm-secret-key-for-jwt-token-generation-minimum-512-bits}
  expiration: 86400000  # 24 hours in milliseconds

deepgram:
  api:
    key: ${DEEPGRAM_API_KEY:}

server:
  port: ${PORT:8080}
  address: 0.0.0.0

logging:
  file:
    path: ${LOG_PATH:/app/logs}
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:/app/logs}/hsm-%d{yyyy-MM-dd}.%i.log
      max-history: 7
      clean-history-on-start: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

info:
  app:
    name: CuraMatrix HSM
    description: Hospital Management System - Multi-Tenant SaaS
    version: '@project.version@'
  build:
    artifact: '@project.artifactId@'
    group: '@project.group@'

management:
  info:
    env:
      enabled: true
    git:
      mode: full
    build:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env
  endpoint:
    health:
      show-details: always
      show-components: always

